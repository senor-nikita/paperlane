name: CI

on:
  push:
    branches: [main]
    # Release-Tags (v0.0.1 ...) loesen zusaetzlich die Paketierung aus.
    tags: ['v*']
  pull_request:
  # Von Hand ausloesbar, damit der Paketierungs-Job unten auch aus einem Zweig
  # heraus gepruefbar ist, ohne vorher nach main zu pushen. Der verify-Job
  # laeuft dabei mit; das kostet wenig und haelt die Ausloeser uebersichtlich.
  workflow_dispatch:

jobs:
  verify:
    # windows-latest, weil die Anwendung dort entwickelt wird und weil
    # Screenshot-Vergleiche plattformbenannte Baselines nutzen. Ein echter
    # Google Chrome ist auf diesem Runner vorinstalliert — Playwrights
    # gebuendeltes Chromium enthaelt keinen PDF-Viewer und taugt fuer die
    # Fremdviewer-Pruefung nicht.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Testkorpus erzeugen und auf Determinismus pruefen
        run: npm run fixtures:check

      - name: Typen, Lint, Unit-Tests, Coverage, Guards
        run: npm run verify

      - name: Bauen
        run: npm run build

      - name: Guards auf Build-Artefakten
        run: npm run guards:build

      - name: E2E
        run: npm run test:e2e

      # Performance-Budgets ab S1.2. Sie laufen in CI nur informativ:
      # geteilte Runner schwanken zu stark fuer harte Zeitgrenzen. Das scharfe
      # Gate ist der lokale Lauf in verify:full (Entscheidung D16).
      # D16: geteilte Runner schwanken zu stark fuer harte Zeitgrenzen, deshalb
      # informativ. Das scharfe Gate ist der lokale Lauf in verify:full.
      - name: Performance-Budgets (informativ)
        run: npm run fixtures && npm run test:perf
        continue-on-error: true

      - name: Playwright-Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

  paketierung:
    # S5.3, Aufgabe 1: "Nur der Windows-Build muss lokal nachweisbar
    # durchlaufen; die uebrigen als Konfiguration plus CI-Job." Die drei Ziele
    # stehen in electron-builder.yml (nsis / dmg / AppImage); dmg und AppImage
    # lassen sich im Projekt nirgends von Hand bauen, dieser Job ist also der
    # einzige Beleg, dass ihre Konfiguration ueberhaupt durchlaeuft.
    #
    # Ausloeser eingeschraenkt: nur von Hand (workflow_dispatch) oder bei einem
    # Release-Tag v*. Bis 2026-09-28 lief der Job bei jedem Push auf main und
    # legte je Lauf rund 440 MB Pakete ab - das kostenlose Actions-Speicher-
    # kontingent (0,5 GB) war damit nach einem Lauf voll. Bei jedem Push
    # traegt der verify-Job die Aussage.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      # Ein fehlschlagendes Ziel soll die beiden anderen nicht abbrechen —
      # sonst verdeckt ein Fehler in einem Ziel, ob die uebrigen laufen.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ziel: --win
            artefakt: paket-windows-nsis
            muster: release/*.exe
          - os: macos-latest
            ziel: --mac
            artefakt: paket-macos-dmg
            muster: release/*.dmg
          - os: ubuntu-latest
            ziel: --linux
            artefakt: paket-linux-appimage
            muster: release/*.AppImage

    env:
      # Signierung ist nicht eingerichtet: D9 ist offen, siehe
      # docs/signierung.md. Auf macOS sucht electron-builder sonst von selbst
      # nach einer Entwickleridentitaet im Schluesselbund; findet es keine,
      # bricht der Lauf ab. `false` schaltet diese Suche ab, sodass der Job
      # weder ein Zertifikat erwartet noch an dessen Fehlen scheitert. Das
      # Ergebnis ist ein unsigniertes Paket — genau der Ist-Zustand, den
      # docs/signierung.md beschreibt. Unter Windows greift dieselbe Lage ohne
      # Zutun: ohne WIN_CSC_LINK/CSC_LINK ueberspringt electron-builder das
      # Signieren still, und `forceCodeSigning` ist nicht gesetzt.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      # Dieselben Einrichtungsschritte wie im verify-Job (Node 24, npm-Cache,
      # npm ci), damit die beiden Jobs sich nicht widersprechen.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Anwendung bauen
        run: npm run build

      # Die Skripte `dist` und `dist:win` aus package.json passen hier nicht:
      # der Job braucht je Laeufer ein anderes Ziel und in jedem Fall
      # `--publish never`. Der Schritt tut deshalb dasselbe wie sie — erst
      # `npm run build` (oben), dann electron-builder — nur mit diesen beiden
      # Zusaetzen.
      #
      # `--publish never`: der Job darf nichts veroeffentlichen.
      # electron-builder.yml traegt bereits `publish: null` (D8, ADR 0004 —
      # das Projekt gibt bewusst keine Update-Zusage und legt keine
      # `app-update.yml` ins Paket). `--publish never` ist der zweite Riegel
      # auf der Kommandozeile: selbst wenn ein Lauf ein GH_TOKEN in der
      # Umgebung haette, legt electron-builder keinen Release an und laedt
      # nichts hoch.
      - name: Paket bauen
        run: npx electron-builder ${{ matrix.ziel }} --publish never

      # Nur die Installationsdatei, nicht die entpackten Verzeichnisse
      # (`release/win-unpacked`, `release/mac*`, `release/linux-unpacked`):
      # die enthalten die komplette Electron-Laufzeit und sind ein Vielfaches
      # gross. `if-no-files-found: error` macht den Job rot, wenn das Muster
      # leer bleibt — ein Build, der kein Paket erzeugt, soll nicht gruen
      # aussehen.
      - name: Paket sichern
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefakt }}
          path: ${{ matrix.muster }}
          if-no-files-found: error
          retention-days: 1
